name: curriculum-l1l6-gate
# Path-scoped gate for the L1-L6 curriculum substrate. ADDITIVE to pr-gate
# (which runs the canonical harness): the canonical harness does not invoke
# these validators until Sol wires the one-line integration, so this workflow
# is the executable proof for the new subsystem. New file — no shared
# workflow was modified.

on:
  pull_request:
    paths:
      - "curriculum/l1l6/**"
      - "tools/build_curriculum_l1l6.py"
      - "tools/validate_curriculum_l1l6.py"
      - "tools/curriculum_unit_consumer.py"
      - "tools/build_curriculum_corpus_pilot.py"
      - "tools/build_curriculum_pvn_links.py"
      - "tools/check_curriculum_fixture_corpus.py"
      - ".github/workflows/curriculum-l1l6-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curriculum-l1l6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: curriculum validator (17 named fail-closed checks)
        run: python tools/validate_curriculum_l1l6.py

      - name: validator mutation self-test (red-first)
        run: python tools/validate_curriculum_l1l6.py --self-test

      - name: task-packet validation (TP-CURR-*)
        run: python tools/validate_task_packets.py curriculum/l1l6/packets/*.json

      - name: candidate consumer self-test (pack mutations flip decisions)
        run: python tools/curriculum_unit_consumer.py --self-test

      - name: candidate consumer — all increments green on latest packs
        run: python tools/curriculum_unit_consumer.py --all

      - name: corpus-pilot envelopes byte-match a live recompute
        run: python tools/build_curriculum_corpus_pilot.py --check

      - name: precise P/V/N links byte-match a live recompute
        run: python tools/build_curriculum_pvn_links.py --check

      - name: deterministic regeneration vs authorized fixture corpus
        run: python tools/check_curriculum_fixture_corpus.py
